name: ${COMPOSE_DEPENDENCIES_PROJECT_NAME:-infra-portal-dependencies}

services:
  mysql:
    container_name: infra-portal-mysql
    image: mysql:${MYSQL_VERSION:-8.0}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${APP_DB_NAME:-middleware_resource_manager}
      MYSQL_ROOT_PASSWORD: ${APP_DB_PASSWORD:-infra-portal-local-db}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - ${DEPLOY_DATA_DIR:-./data}/mysql:/var/lib/mysql
      - ../db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  nacos:
    container_name: infra-portal-nacos
    image: nacos/nacos-server:${NACOS_VERSION:-v2.3.2-slim}
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-true}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-aW5mcmEtcG9ydGFsLWxvY2FsLW5hY29zLWF1dGgtdG9rZW4tY2hhbmdlLW1l}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-infra-portal-local-key}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-infra-portal-local-value}
    ports:
      - "${NACOS_BIND_ADDRESS:-0.0.0.0}:${NACOS_PORT:-8848}:8848"
    volumes:
      - ${DEPLOY_DATA_DIR:-./data}/nacos/data:/home/nacos/data
      - ${DEPLOY_DATA_DIR:-./data}/nacos/logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s

  nacos-init:
    container_name: infra-portal-nacos-init
    image: ${IMAGE_NAMESPACE:-infra-portal}/nacos-init:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.nacos-init
    restart: "no"
    environment:
      NACOS_URL: http://nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      NACOS_CONFIG_GROUP: ${NACOS_CONFIG_GROUP:-DEFAULT_GROUP}
      NACOS_CONFIG_DIR: /config
    depends_on:
      nacos:
        condition: service_healthy

  etcd:
    container_name: infra-portal-etcd
    image: quay.io/coreos/etcd:${ETCD_VERSION:-v3.5.5}
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd
      --advertise-client-urls=http://127.0.0.1:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - ${DEPLOY_DATA_DIR:-./data}/milvus/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    container_name: infra-portal-minio
    image: minio/minio:${MINIO_VERSION:-RELEASE.2023-03-20T20-16-18Z}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-infra-portal-local-minio}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-infra-portal-local-minio}
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ${DEPLOY_DATA_DIR:-./data}/milvus/minio:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    container_name: infra-portal-milvus
    image: milvusdb/milvus:${MILVUS_VERSION:-v2.5.10}
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-infra-portal-local-minio}
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-infra-portal-local-minio}
    ports:
      - "127.0.0.1:${MILVUS_PORT:-19530}:19530"
      - "127.0.0.1:${MILVUS_WEBUI_PORT:-9091}:9091"
    volumes:
      - ${DEPLOY_DATA_DIR:-./data}/milvus/data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s

networks:
  default:
    name: ${COMPOSE_NETWORK_NAME:-infra-portal-network}
