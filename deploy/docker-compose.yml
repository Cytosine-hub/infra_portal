name: ${COMPOSE_BUSINESS_PROJECT_NAME:-infra-portal}

x-app-environment: &app-environment
  SPRING_PROFILES_ACTIVE: cloud
  APP_DB_HOST: mysql
  APP_DB_PORT: 3306
  APP_DB_NAME: ${APP_DB_NAME:-middleware_resource_manager}
  APP_DB_USERNAME: ${APP_DB_USERNAME:-root}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:-infra-portal-local-db}
  NACOS_SERVER_ADDR: nacos:8848
  NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
  NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
  NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
  NACOS_CONFIG_GROUP: ${NACOS_CONFIG_GROUP:-DEFAULT_GROUP}
  NACOS_DISCOVERY_GROUP: ${NACOS_DISCOVERY_GROUP:-DEFAULT_GROUP}

x-gateway-environment: &gateway-environment
  SPRING_PROFILES_ACTIVE: cloud
  NACOS_SERVER_ADDR: nacos:8848
  NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
  NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
  NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
  NACOS_CONFIG_GROUP: ${NACOS_CONFIG_GROUP:-DEFAULT_GROUP}
  NACOS_DISCOVERY_GROUP: ${NACOS_DISCOVERY_GROUP:-DEFAULT_GROUP}

x-application: &application
  restart: unless-stopped
  env_file:
    - path: ${BUSINESS_ENV_FILE:-./services.env}
      required: false
  extra_hosts:
    - host.containers.internal:host-gateway
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        status=$$(curl --silent --output /dev/null --write-out '%{http_code}'
        http://localhost:$$SERVER_PORT/); [ "$$status" != "000" ]
    interval: 10s
    timeout: 5s
    retries: 18
    start_period: 45s

x-gateway: &gateway
  restart: unless-stopped
  env_file:
    - path: ${BUSINESS_ENV_FILE:-./services.env}
      required: false
  extra_hosts:
    - host.containers.internal:host-gateway
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        status=$$(curl --silent --output /dev/null --write-out '%{http_code}'
        http://localhost:8080/); [ "$$status" != "000" ]
    interval: 10s
    timeout: 5s
    retries: 18
    start_period: 45s

services:
  api-gateway:
    container_name: infra-portal-api-gateway
    <<: *gateway
    image: ${IMAGE_NAMESPACE:-infra-portal}/api-gateway:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: api-gateway
    environment:
      <<: *gateway-environment
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"

  core-service:
    container_name: infra-portal-core-service
    <<: *application
    image: ${IMAGE_NAMESPACE:-infra-portal}/core-service:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: core-service
    environment:
      <<: *app-environment
      SERVER_PORT: 8084
    ports:
      - "127.0.0.1:${CORE_SERVICE_PORT:-8084}:8084"
    volumes:
      - ${DEPLOY_DATA_ROOT:-./data}/business/core-service/storage:/app/storage

  ai-service:
    container_name: infra-portal-ai-service
    <<: *application
    image: ${IMAGE_NAMESPACE:-infra-portal}/ai-service:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: ai-service
    environment:
      <<: *app-environment
      SERVER_PORT: 8083
      VECTOR_TYPE: milvus
      VECTOR_HOST: milvus
      VECTOR_PORT: 19530
    ports:
      - "127.0.0.1:${AI_SERVICE_PORT:-8083}:8083"
    volumes:
      - ${DEPLOY_DATA_ROOT:-./data}/business/ai-service/storage:/app/storage
      - ${DEPLOY_DATA_ROOT:-./data}/business/ai-service/data:/app/data

  community-service:
    container_name: infra-portal-community-service
    <<: *application
    image: ${IMAGE_NAMESPACE:-infra-portal}/community-service:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: community-service
    environment:
      <<: *app-environment
      SERVER_PORT: 8082
    ports:
      - "127.0.0.1:${COMMUNITY_SERVICE_PORT:-8082}:8082"

  middleware-service:
    container_name: infra-portal-middleware-service
    <<: *application
    image: ${IMAGE_NAMESPACE:-infra-portal}/middleware-service:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: middleware-service
    environment:
      <<: *app-environment
      SERVER_PORT: 8085
    ports:
      - "127.0.0.1:${MIDDLEWARE_SERVICE_PORT:-8085}:8085"

  database-service:
    container_name: infra-portal-database-service
    <<: *application
    image: ${IMAGE_NAMESPACE:-infra-portal}/database-service:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: database-service
    environment:
      <<: *app-environment
      SERVER_PORT: 8086
    ports:
      - "127.0.0.1:${DATABASE_SERVICE_PORT:-8086}:8086"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s

  host-service:
    container_name: infra-portal-host-service
    <<: *application
    image: ${IMAGE_NAMESPACE:-infra-portal}/host-service:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: host-service
    environment:
      <<: *app-environment
      SERVER_PORT: 8087
    ports:
      - "127.0.0.1:${HOST_SERVICE_PORT:-8087}:8087"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8087/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s

  network-service:
    container_name: infra-portal-network-service
    <<: *application
    image: ${IMAGE_NAMESPACE:-infra-portal}/network-service:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: network-service
    environment:
      <<: *app-environment
      SERVER_PORT: 8088
    ports:
      - "127.0.0.1:${NETWORK_SERVICE_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s

  security-service:
    container_name: infra-portal-security-service
    <<: *application
    image: ${IMAGE_NAMESPACE:-infra-portal}/security-service:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: security-service
    environment:
      <<: *app-environment
      SERVER_PORT: 8089
    ports:
      - "127.0.0.1:${SECURITY_SERVICE_PORT:-8089}:8089"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8089/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s

  frontend:
    container_name: infra-portal-frontend
    image: ${IMAGE_NAMESPACE:-infra-portal}/frontend:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  default:
    name: ${COMPOSE_NETWORK_NAME:-infra-portal-network}
    external: true
