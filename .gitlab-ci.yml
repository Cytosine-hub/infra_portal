    - changes:
        - backend/api-gateway/**/*
        - backend/pom.xml
        - backend/modular-monolith-parent/pom.xml
        - backend/common-core/**/*
        - backend/common-security/**/*
        - backend/common-web/**/*
        - .gitlab-ci.yml

