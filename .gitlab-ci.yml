# ============================================================================
# 集成中心门户 · monorepo 微服务 CI/CD
#
# 设计：先执行 CI/Compose 契约门禁，再按【路径触发】构建受影响服务；
#       改动共享库 common-* 或父 POM 则【扇出】重建所有服务。
# 后端首次镜像构建执行全量 Maven verify；其余服务复用相同 BuildKit 构建层，
# 避免共享库变更时重复编译和重复运行测试。所有构建成功后才允许增量部署。
#
# 需要：Runner Job 可访问 Runner 主机的 Docker Socket（见 runner/config.md）。
#       编译、镜像构建和 Docker Compose 部署均在同一台 Runner 主机完成，不推送 JAR 或镜像制品。
# ============================================================================

# 只在【前后端、部署配置或 CI 文件】改动时创建流水线（MR / push / tag），
# 或由 GitLab Web 页面手动创建完整流水线。
# 纯文档改动（agent.md、docs、README 等）没有可跑的 job → 不创建流水线，
# 避免 GitLab 把"空流水线"判为 failed（doc-only 合并不再爆红叉）。
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: ["backend/**/*", "frontend/**/*", "deploy/**/*", "db/**/*", ".gitlab-ci.yml"]
    # 已有 MR 时只保留 MR 流水线，避免同一提交同时创建 push + MR 两条流水线。
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes: ["backend/**/*", "frontend/**/*", "deploy/**/*", "db/**/*", ".gitlab-ci.yml"]

default:
  image:
    name: docker:27-cli
    pull_policy: if-not-present       # 仅本地不存在时拉取镜像
  tags: [TLZJJ]                       # 项目 Runner 标签
  interruptible: true                # 新提交可取消仍在执行的旧验证/构建任务
  before_script:
    - export IMAGE_TAG="$(sh deploy/image-tag.sh "$CI_COMMIT_SHA" "$CI_PIPELINE_CREATED_AT")"

variables:
  TZ: "Asia/Shanghai"
  DOCKER_BUILDKIT: "1"
  IMAGE_NAMESPACE: "infra-portal"
  # Compose 清单与运行数据分别持久化，避免 Job 清理 /builds 后无法手动管理。
  DEPLOY_COMPOSE_ROOT: "/app/infra-portal/compose"
  DEPLOY_DATA_ROOT: "/app/infra-portal/data"
  DEPLOY_ROLLBACK_STATE_ROOT: "/app/infra-portal/compose/rollback"

stages:
  - validate      # Shell/CI/Compose 契约门禁
  - build         # 单元测试 + 编译 + 镜像构建（按路径增量）
  - deploy        # 全部门禁通过后部署受影响服务
  - rollback      # 手动恢复上一成功业务版本
  - cleanup       # 定时清理 Runner 主机上的过期业务镜像

# 复用 Web 流水线中的非阻断手动作业规则。
.manual-rule:
  rules:
    - &skip-schedule
      if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - &web-manual
      if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

# 静态门禁使用临时随机测试密钥，不读取受保护变量，也不启动或更新服务。
verify:deployment:
  stage: validate
  script:
    - trap 'rm -f deploy/compose.test.env deploy/services.test.env' EXIT
    - sh -n deploy/*.sh deploy/tests/*.sh
    - sh deploy/tests/ci-contract.sh
    - sh deploy/tests/compose-contract.sh
    - sh deploy/tests/nacos-init-test.sh
    - sh deploy/tests/image-maintenance-test.sh
    - sh deploy/tests/ai-auth-preflight-test.sh
    - sh deploy/tests/rollback-test.sh
    - sh deploy/generate-test-env.sh
    - docker compose --env-file deploy/compose.test.env --file deploy/docker-compose.yml config --quiet
    - docker compose --env-file deploy/compose.test.env --file deploy/docker-compose.dependencies.yml config --quiet
  rules:
    - *skip-schedule
    - *web-manual
    - changes:
        - deploy/**/*
        - db/**/*
        - .gitignore
        - .gitlab-ci.yml

# 服务构建模板：Docker 多阶段构建首次执行全量 Maven verify，后续服务镜像复用该层。
# 镜像使用上海日期和 7 位提交 SHA 组成的不可变标签，并保留在 Runner 主机 Docker 守护进程中。
.svc-verify:
  stage: build
  script:
    - docker build --build-arg SERVICE="$SVC" --build-arg IMAGE_REVISION="$CI_COMMIT_SHA" --build-arg IMAGE_VERSION="$IMAGE_TAG" --tag "$IMAGE_NAMESPACE/$SVC:$IMAGE_TAG" --file deploy/Dockerfile .
    - echo "== Runner 主机构建镜像：$IMAGE_NAMESPACE/$SVC:$IMAGE_TAG =="
    - docker image inspect "$IMAGE_NAMESPACE/$SVC:$IMAGE_TAG" --format 'ID={{.Id}}\n创建时间={{.Created}}\n大小={{.Size}} bytes'

# 完整业务服务构建入口。单服务构建仍复用下方 verify:<service> job，
# 可按路径自动触发，也可在 Web 流水线中逐项手动运行。
verify:all-backend-services:
  stage: build
  script:
    - |
      for SVC in api-gateway core-service ai-service community-service middleware-service database-service host-service network-service security-service; do
        docker build --build-arg SERVICE="$SVC" --build-arg IMAGE_REVISION="$CI_COMMIT_SHA" --build-arg IMAGE_VERSION="$IMAGE_TAG" --tag "$IMAGE_NAMESPACE/$SVC:$IMAGE_TAG" --file deploy/Dockerfile .
        docker image inspect "$IMAGE_NAMESPACE/$SVC:$IMAGE_TAG" --format 'ID={{.Id}}\n创建时间={{.Created}}\n大小={{.Size}} bytes'
      done
  rules:
    - *skip-schedule
    - *web-manual
    - if: '$CI_COMMIT_REF_NAME == "master"'
      when: manual
      allow_failure: true
    - changes:
        - deploy/**/*
        - db/**/*
      when: manual
      allow_failure: true

# Compose 中的前端生产镜像，使用与本地完整栈相同的多阶段构建定义。
verify:frontend:
  stage: build
  script:
    - docker build --build-arg IMAGE_REVISION="$CI_COMMIT_SHA" --build-arg IMAGE_VERSION="$IMAGE_TAG" --tag "$IMAGE_NAMESPACE/frontend:$IMAGE_TAG" --file deploy/Dockerfile.frontend .
    - docker image inspect "$IMAGE_NAMESPACE/frontend:$IMAGE_TAG" --format 'ID={{.Id}}\n创建时间={{.Created}}\n大小={{.Size}} bytes'
  rules:
    - *skip-schedule
    - *web-manual
    - changes:
        - frontend/**/*
        - deploy/{Dockerfile.frontend,nginx.conf}
        - .gitlab-ci.yml

# ----------------------------------------------------------------------------
# 每服务流水线（路径触发）。
# 每个 changes 列表 = 该服务自身 + 其能力模块 + 【扇出段】(共享库/父POM/本文件)。
# 改共享库 → 所有服务的扇出段命中 → 全部重建。
# ----------------------------------------------------------------------------
verify:api-gateway:
  extends: .svc-verify
  variables: { SVC: api-gateway }
  rules:
    - *skip-schedule
    - *web-manual
    - changes:
        - backend/api-gateway/**/*
        - backend/{pom.xml,modular-monolith-parent/pom.xml,common-core/**/*,common-security/**/*,common-web/**/*}
        - .gitlab-ci.yml

verify:core-service:
  extends: .svc-verify
  variables: { SVC: core-service }
  rules:
    - *skip-schedule
    - *web-manual
    - changes:
        - backend/{core-service,identity,catalog,standards}/**/*
        - backend/{pom.xml,modular-monolith-parent/pom.xml,common-core/**/*,common-security/**/*,common-web/**/*}
        - .gitlab-ci.yml

verify:ai-service:
  extends: .svc-verify
  variables: { SVC: ai-service }
  rules:
    - *skip-schedule
    - *web-manual
    - changes:
        - backend/{ai-service,knowledge,wiki,ops-agent}/**/*
        - backend/{pom.xml,modular-monolith-parent/pom.xml,common-core/**/*,common-security/**/*,common-web/**/*}
        - .gitlab-ci.yml

verify:community-service:
  extends: .svc-verify
  variables: { SVC: community-service }
  rules:
    - *skip-schedule
    - *web-manual
    - changes:
        - backend/{community-service,community}/**/*
        - backend/{pom.xml,modular-monolith-parent/pom.xml,common-core/**/*,common-security/**/*,common-web/**/*}
        - .gitlab-ci.yml

verify:middleware-service:
  extends: .svc-verify
  variables: { SVC: middleware-service }
  rules:
    - *skip-schedule
    - *web-manual
    - changes:
        - backend/{middleware-service,job-middleware}/**/*
        - backend/{pom.xml,modular-monolith-parent/pom.xml,common-core/**/*,common-security/**/*,common-web/**/*}
        - .gitlab-ci.yml

verify:database-service:
  extends: .svc-verify
  variables: { SVC: database-service }
  rules:
    - *skip-schedule
    - *web-manual
    - changes:
        - backend/{database-service,job-database}/**/*
        - backend/{pom.xml,modular-monolith-parent/pom.xml,common-core/**/*,common-security/**/*,common-web/**/*}
        - .gitlab-ci.yml

verify:host-service:
  extends: .svc-verify
  variables: { SVC: host-service }
  rules:
    - *skip-schedule
    - *web-manual
    - changes:
        - backend/{host-service,job-host}/**/*
        - backend/{pom.xml,modular-monolith-parent/pom.xml,common-core/**/*,common-security/**/*,common-web/**/*}
        - .gitlab-ci.yml

verify:network-service:
  extends: .svc-verify
  variables: { SVC: network-service }
  rules:
    - *skip-schedule
    - *web-manual
    - changes:
        - backend/{network-service,job-network}/**/*
        - backend/{pom.xml,modular-monolith-parent/pom.xml,common-core/**/*,common-security/**/*,common-web/**/*}
        - .gitlab-ci.yml

verify:security-service:
  extends: .svc-verify
  variables: { SVC: security-service }
  rules:
    - *skip-schedule
    - *web-manual
    - changes:
        - backend/{security-service,job-security}/**/*
        - backend/{pom.xml,modular-monolith-parent/pom.xml,common-core/**/*,common-security/**/*,common-web/**/*}
        - .gitlab-ci.yml

# ----------------------------------------------------------------------------
# 部署：使用 Runner 主机 Docker Compose 启动对应服务，镜像只读取 Runner 主机已构建版本。
# DEPLOY_COMPOSE_ENV_FILE 必须配置为受保护的 File 变量；业务部署还需要
# DEPLOY_SERVICES_ENV_FILE。两者分别基于对应 example 文件，禁止提交真实密钥。
# ----------------------------------------------------------------------------
.deploy-base:
  stage: deploy
  resource_group: staging-infra-portal
  interruptible: false
  rules:
    - *skip-schedule
    - *web-manual
    - if: '$CI_COMMIT_REF_NAME == "master"'
      when: manual
      allow_failure: true

.deploy-common:
  extends: .deploy-base
  before_script:
    - export IMAGE_TAG="$(sh deploy/image-tag.sh "$CI_COMMIT_SHA" "$CI_PIPELINE_CREATED_AT")"
    - ': "${DEPLOY_COMPOSE_ENV_FILE:?缺少 DEPLOY_COMPOSE_ENV_FILE（GitLab File 类型变量）}"'
    - ': "${DEPLOY_SERVICES_ENV_FILE:?缺少 DEPLOY_SERVICES_ENV_FILE（GitLab File 类型变量）}"'
    - ': "${AI_API_KEY:?缺少 AI_API_KEY（GitLab Masked 变量）}"'
    - ': "${AUTO_ROLLBACK_ENABLED:?缺少 AUTO_ROLLBACK_ENABLED（GitLab CI/CD Variable，值必须为 true 或 false）}"'
    - test -f "$DEPLOY_COMPOSE_ENV_FILE"
    - test -f "$DEPLOY_SERVICES_ENV_FILE"
    - |
      if grep -q '^COMPOSE_PROJECT_NAME=' "$DEPLOY_COMPOSE_ENV_FILE"; then
        echo '检测到旧变量 COMPOSE_PROJECT_NAME，请改用 COMPOSE_BUSINESS_PROJECT_NAME 后重新部署'
        exit 1
      fi
    - export BUSINESS_ENV_FILE="$DEPLOY_SERVICES_ENV_FILE"
    - docker compose --env-file "$DEPLOY_COMPOSE_ENV_FILE" --file deploy/docker-compose.yml config --quiet
    - export DEPLOY_BUSINESS_DIR="$DEPLOY_COMPOSE_ROOT/business"
    - export DEPLOY_COMPOSE_FILE="$DEPLOY_BUSINESS_DIR/compose.yml"
    - export DEPLOY_COMPOSE_ENV="$DEPLOY_BUSINESS_DIR/compose.env"
    - export DEPLOY_SERVICES_ENV="$DEPLOY_BUSINESS_DIR/services.env"
    - umask 077
    - mkdir -p "$DEPLOY_BUSINESS_DIR" "$DEPLOY_DATA_ROOT"
    - chmod 700 "$DEPLOY_BUSINESS_DIR"
    - cp deploy/docker-compose.yml "$DEPLOY_COMPOSE_FILE"
    - cp "$DEPLOY_COMPOSE_ENV_FILE" "$DEPLOY_COMPOSE_ENV"
    - cp "$DEPLOY_SERVICES_ENV_FILE" "$DEPLOY_SERVICES_ENV"
    - |
      services_env_tmp="${DEPLOY_SERVICES_ENV}.tmp"
      awk -v ai_api_key="$AI_API_KEY" '
        BEGIN { replaced = 0 }
        /^AI_API_KEY=/ {
          if (!replaced) {
            print "AI_API_KEY=" ai_api_key
            replaced = 1
          }
          next
        }
        { print }
        END {
          if (!replaced) print "AI_API_KEY=" ai_api_key
        }
      ' "$DEPLOY_SERVICES_ENV" > "$services_env_tmp"
      mv "$services_env_tmp" "$DEPLOY_SERVICES_ENV"
    - |
      if grep -q '^IMAGE_TAG=' "$DEPLOY_COMPOSE_ENV"; then
        sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" "$DEPLOY_COMPOSE_ENV"
      else
        printf '\nIMAGE_TAG=%s\n' "$IMAGE_TAG" >> "$DEPLOY_COMPOSE_ENV"
      fi
      if grep -q '^BUSINESS_ENV_FILE=' "$DEPLOY_COMPOSE_ENV"; then
        sed -i 's|^BUSINESS_ENV_FILE=.*|BUSINESS_ENV_FILE=./services.env|' "$DEPLOY_COMPOSE_ENV"
      else
        printf '\nBUSINESS_ENV_FILE=./services.env\n' >> "$DEPLOY_COMPOSE_ENV"
      fi
      sed -i '/^DEPLOY_DATA_DIR=/d' "$DEPLOY_COMPOSE_ENV"
      if grep -q '^DEPLOY_DATA_ROOT=' "$DEPLOY_COMPOSE_ENV"; then
        sed -i "s|^DEPLOY_DATA_ROOT=.*|DEPLOY_DATA_ROOT=$DEPLOY_DATA_ROOT|" "$DEPLOY_COMPOSE_ENV"
      else
        printf '\nDEPLOY_DATA_ROOT=%s\n' "$DEPLOY_DATA_ROOT" >> "$DEPLOY_COMPOSE_ENV"
      fi
    - chmod 600 "$DEPLOY_COMPOSE_ENV" "$DEPLOY_SERVICES_ENV"
    - chmod 644 "$DEPLOY_COMPOSE_FILE"
    - export BUSINESS_ENV_FILE=./services.env
    - export COMPOSE_ENV_FILE="$DEPLOY_COMPOSE_ENV"
    - export COMPOSE_FILE="$DEPLOY_COMPOSE_FILE"
    - export ROLLBACK_STATE_ROOT="$DEPLOY_ROLLBACK_STATE_ROOT"
    - docker compose --env-file "$DEPLOY_COMPOSE_ENV" --file "$DEPLOY_COMPOSE_FILE" config --quiet

.deploy-dependencies-common:
  extends: .deploy-base
  before_script:
    - export IMAGE_TAG="$(sh deploy/image-tag.sh "$CI_COMMIT_SHA" "$CI_PIPELINE_CREATED_AT")"
    - ': "${DEPLOY_COMPOSE_ENV_FILE:?缺少 DEPLOY_COMPOSE_ENV_FILE（GitLab File 类型变量）}"'
    - test -f "$DEPLOY_COMPOSE_ENV_FILE"
    - |
      if grep -q '^COMPOSE_PROJECT_NAME=' "$DEPLOY_COMPOSE_ENV_FILE"; then
        echo '检测到旧变量 COMPOSE_PROJECT_NAME，请改用 COMPOSE_BUSINESS_PROJECT_NAME 后重新部署'
        exit 1
      fi
    - docker compose --env-file "$DEPLOY_COMPOSE_ENV_FILE" --file deploy/docker-compose.dependencies.yml config --quiet
    - export DEPLOY_DEPENDENCIES_DIR="$DEPLOY_COMPOSE_ROOT/dependencies"
    - export DEPLOY_DEPENDENCIES_COMPOSE_FILE="$DEPLOY_DEPENDENCIES_DIR/compose.yml"
    - export DEPLOY_DEPENDENCIES_COMPOSE_ENV="$DEPLOY_DEPENDENCIES_DIR/compose.env"
    - export DEPLOY_MYSQL_INIT_DIR="$DEPLOY_DEPENDENCIES_DIR/initdb"
    - mkdir -p "$DEPLOY_DEPENDENCIES_DIR" "$DEPLOY_MYSQL_INIT_DIR" "$DEPLOY_DATA_ROOT"
    - chmod 700 "$DEPLOY_DEPENDENCIES_DIR"
    - cp deploy/docker-compose.dependencies.yml "$DEPLOY_DEPENDENCIES_COMPOSE_FILE"
    - cp "$DEPLOY_COMPOSE_ENV_FILE" "$DEPLOY_DEPENDENCIES_COMPOSE_ENV"
    - cp db/init.sql "$DEPLOY_MYSQL_INIT_DIR/init.sql"
    - cp db/seed.sql "$DEPLOY_MYSQL_INIT_DIR/seed.sql"
    - |
      if grep -q '^IMAGE_TAG=' "$DEPLOY_DEPENDENCIES_COMPOSE_ENV"; then
        sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" "$DEPLOY_DEPENDENCIES_COMPOSE_ENV"
      else
        printf '\nIMAGE_TAG=%s\n' "$IMAGE_TAG" >> "$DEPLOY_DEPENDENCIES_COMPOSE_ENV"
      fi
      sed -i '/^DEPLOY_DATA_DIR=/d' "$DEPLOY_DEPENDENCIES_COMPOSE_ENV"
      if grep -q '^DEPLOY_DATA_ROOT=' "$DEPLOY_DEPENDENCIES_COMPOSE_ENV"; then
        sed -i "s|^DEPLOY_DATA_ROOT=.*|DEPLOY_DATA_ROOT=$DEPLOY_DATA_ROOT|" "$DEPLOY_DEPENDENCIES_COMPOSE_ENV"
      else
        printf '\nDEPLOY_DATA_ROOT=%s\n' "$DEPLOY_DATA_ROOT" >> "$DEPLOY_DEPENDENCIES_COMPOSE_ENV"
      fi
      if grep -q '^MYSQL_INIT_DIR=' "$DEPLOY_DEPENDENCIES_COMPOSE_ENV"; then
        sed -i 's|^MYSQL_INIT_DIR=.*|MYSQL_INIT_DIR=./initdb|' "$DEPLOY_DEPENDENCIES_COMPOSE_ENV"
      else
        printf '\nMYSQL_INIT_DIR=./initdb\n' >> "$DEPLOY_DEPENDENCIES_COMPOSE_ENV"
      fi
    - chmod 600 "$DEPLOY_DEPENDENCIES_COMPOSE_ENV"
    - chmod 644 "$DEPLOY_DEPENDENCIES_COMPOSE_FILE" "$DEPLOY_MYSQL_INIT_DIR/init.sql" "$DEPLOY_MYSQL_INIT_DIR/seed.sql"
    - docker compose --env-file "$DEPLOY_DEPENDENCIES_COMPOSE_ENV" --file "$DEPLOY_DEPENDENCIES_COMPOSE_FILE" config --quiet

.deploy-tpl:
  extends: .deploy-common
  environment:
    name: "staging/$SVC"
  script:
    - |
      if ! docker image inspect "$IMAGE_NAMESPACE/$SVC:$IMAGE_TAG" >/dev/null 2>&1; then
        echo "Runner 缺少服务镜像，开始构建：$IMAGE_NAMESPACE/$SVC:$IMAGE_TAG"
        docker build --build-arg SERVICE="$SVC" \
          --build-arg IMAGE_REVISION="$CI_COMMIT_SHA" \
          --build-arg IMAGE_VERSION="$IMAGE_TAG" \
          --tag "$IMAGE_NAMESPACE/$SVC:$IMAGE_TAG" \
          --file deploy/Dockerfile .
      fi
    - if [ "$SVC" = "ai-service" ]; then sh deploy/validate-ai-auth.sh "$DEPLOY_SERVICES_ENV" "$IMAGE_NAMESPACE/ai-service:$IMAGE_TAG" "$DEPLOY_COMPOSE_ENV"; fi
    - sh deploy/rollback.sh deploy "$SVC"

# 单独部署依赖组件。MySQL 首次创建数据卷时会执行 db/init.sql 和 db/seed.sql；
# 后续部署不会重放初始化脚本。
deploy:dependencies:
  extends: .deploy-dependencies-common
  environment:
    name: staging/dependencies
  script:
    - docker build --tag "$IMAGE_NAMESPACE/nacos-init:$IMAGE_TAG" --file deploy/Dockerfile.nacos-init .
    - |
      for IMAGE in $(docker compose --env-file "$DEPLOY_DEPENDENCIES_COMPOSE_ENV" --file "$DEPLOY_DEPENDENCIES_COMPOSE_FILE" config --images); do
        case "$IMAGE" in
          "$IMAGE_NAMESPACE"/*) continue ;;
        esac
        if docker image inspect "$IMAGE" >/dev/null 2>&1; then
          echo "依赖镜像已存在，跳过拉取：$IMAGE"
        else
          docker pull "$IMAGE"
        fi
      done
    - docker compose --env-file "$DEPLOY_DEPENDENCIES_COMPOSE_ENV" --file "$DEPLOY_DEPENDENCIES_COMPOSE_FILE" up --detach --wait --no-build --pull never mysql nacos etcd minio milvus ollama
    - docker compose --env-file "$DEPLOY_DEPENDENCIES_COMPOSE_ENV" --file "$DEPLOY_DEPENDENCIES_COMPOSE_FILE" run --rm --no-deps ollama-init
    - docker compose --env-file "$DEPLOY_DEPENDENCIES_COMPOSE_ENV" --file "$DEPLOY_DEPENDENCIES_COMPOSE_FILE" run --rm --no-deps nacos-init
    - docker compose --env-file "$DEPLOY_DEPENDENCIES_COMPOSE_ENV" --file "$DEPLOY_DEPENDENCIES_COMPOSE_FILE" ps --all mysql nacos nacos-init ollama ollama-init etcd minio milvus

# 部署全部 9 个后端服务，不构建或重启前端，也不操作依赖组件。
deploy:all-backend-services:
  extends: .deploy-common
  environment:
    name: staging/all-backend-services
  script:
    - |
      for SVC in api-gateway core-service ai-service community-service middleware-service database-service host-service network-service security-service; do
        if ! docker image inspect "$IMAGE_NAMESPACE/$SVC:$IMAGE_TAG" >/dev/null 2>&1; then
          echo "Runner 缺少服务镜像，开始构建：$IMAGE_NAMESPACE/$SVC:$IMAGE_TAG"
          docker build --build-arg SERVICE="$SVC" \
            --build-arg IMAGE_REVISION="$CI_COMMIT_SHA" \
            --build-arg IMAGE_VERSION="$IMAGE_TAG" \
            --tag "$IMAGE_NAMESPACE/$SVC:$IMAGE_TAG" \
            --file deploy/Dockerfile .
        fi
      done
    - sh deploy/validate-ai-auth.sh "$DEPLOY_SERVICES_ENV" "$IMAGE_NAMESPACE/ai-service:$IMAGE_TAG" "$DEPLOY_COMPOSE_ENV"
    - sh deploy/rollback.sh deploy api-gateway core-service ai-service community-service middleware-service database-service host-service network-service security-service

# 部署完整业务栈：9 个后端服务加前端，不操作依赖组件。
deploy:all-services:
  extends: .deploy-common
  environment:
    name: staging/all-services
  script:
    - |
      for SVC in api-gateway core-service ai-service community-service middleware-service database-service host-service network-service security-service; do
        docker build --build-arg SERVICE="$SVC" --build-arg IMAGE_REVISION="$CI_COMMIT_SHA" --build-arg IMAGE_VERSION="$IMAGE_TAG" --tag "$IMAGE_NAMESPACE/$SVC:$IMAGE_TAG" --file deploy/Dockerfile .
      done
    - docker build --build-arg IMAGE_REVISION="$CI_COMMIT_SHA" --build-arg IMAGE_VERSION="$IMAGE_TAG" --tag "$IMAGE_NAMESPACE/frontend:$IMAGE_TAG" --file deploy/Dockerfile.frontend .
    - sh deploy/validate-ai-auth.sh "$DEPLOY_SERVICES_ENV" "$IMAGE_NAMESPACE/ai-service:$IMAGE_TAG" "$DEPLOY_COMPOSE_ENV"
    - DEPLOY_VERIFY_MODE=full sh deploy/rollback.sh deploy api-gateway core-service ai-service community-service middleware-service database-service host-service network-service security-service frontend

# 初始化或全量部署：先初始化/更新依赖栈，再构建并部署完整业务栈。
deploy:full-stack:
  extends: .deploy-common
  environment:
    name: staging/full-stack
  script:
    - export DEPLOY_DEPENDENCIES_DIR="$DEPLOY_COMPOSE_ROOT/dependencies"
    - export DEPLOY_DEPENDENCIES_COMPOSE_FILE="$DEPLOY_DEPENDENCIES_DIR/compose.yml"
    - export DEPLOY_DEPENDENCIES_COMPOSE_ENV="$DEPLOY_DEPENDENCIES_DIR/compose.env"
    - export DEPLOY_MYSQL_INIT_DIR="$DEPLOY_DEPENDENCIES_DIR/initdb"
    - mkdir -p "$DEPLOY_DEPENDENCIES_DIR" "$DEPLOY_MYSQL_INIT_DIR" "$DEPLOY_DATA_ROOT"
    - chmod 700 "$DEPLOY_DEPENDENCIES_DIR"
    - cp deploy/docker-compose.dependencies.yml "$DEPLOY_DEPENDENCIES_COMPOSE_FILE"
    - cp "$DEPLOY_COMPOSE_ENV_FILE" "$DEPLOY_DEPENDENCIES_COMPOSE_ENV"
    - cp db/init.sql "$DEPLOY_MYSQL_INIT_DIR/init.sql"
    - cp db/seed.sql "$DEPLOY_MYSQL_INIT_DIR/seed.sql"
    - |
      if grep -q '^IMAGE_TAG=' "$DEPLOY_DEPENDENCIES_COMPOSE_ENV"; then
        sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" "$DEPLOY_DEPENDENCIES_COMPOSE_ENV"
      else
        printf '\nIMAGE_TAG=%s\n' "$IMAGE_TAG" >> "$DEPLOY_DEPENDENCIES_COMPOSE_ENV"
      fi
      sed -i '/^DEPLOY_DATA_DIR=/d' "$DEPLOY_DEPENDENCIES_COMPOSE_ENV"
      if grep -q '^DEPLOY_DATA_ROOT=' "$DEPLOY_DEPENDENCIES_COMPOSE_ENV"; then
        sed -i "s|^DEPLOY_DATA_ROOT=.*|DEPLOY_DATA_ROOT=$DEPLOY_DATA_ROOT|" "$DEPLOY_DEPENDENCIES_COMPOSE_ENV"
      else
        printf '\nDEPLOY_DATA_ROOT=%s\n' "$DEPLOY_DATA_ROOT" >> "$DEPLOY_DEPENDENCIES_COMPOSE_ENV"
      fi
      if grep -q '^MYSQL_INIT_DIR=' "$DEPLOY_DEPENDENCIES_COMPOSE_ENV"; then
        sed -i 's|^MYSQL_INIT_DIR=.*|MYSQL_INIT_DIR=./initdb|' "$DEPLOY_DEPENDENCIES_COMPOSE_ENV"
      else
        printf '\nMYSQL_INIT_DIR=./initdb\n' >> "$DEPLOY_DEPENDENCIES_COMPOSE_ENV"
      fi
    - chmod 600 "$DEPLOY_DEPENDENCIES_COMPOSE_ENV"
    - chmod 644 "$DEPLOY_DEPENDENCIES_COMPOSE_FILE" "$DEPLOY_MYSQL_INIT_DIR/init.sql" "$DEPLOY_MYSQL_INIT_DIR/seed.sql"
    - docker compose --env-file "$DEPLOY_DEPENDENCIES_COMPOSE_ENV" --file "$DEPLOY_DEPENDENCIES_COMPOSE_FILE" config --quiet
    - docker build --tag "$IMAGE_NAMESPACE/nacos-init:$IMAGE_TAG" --file deploy/Dockerfile.nacos-init .
    - docker compose --env-file "$DEPLOY_DEPENDENCIES_COMPOSE_ENV" --file "$DEPLOY_DEPENDENCIES_COMPOSE_FILE" up --detach --wait --no-build --pull missing mysql nacos etcd minio milvus ollama
    - docker compose --env-file "$DEPLOY_DEPENDENCIES_COMPOSE_ENV" --file "$DEPLOY_DEPENDENCIES_COMPOSE_FILE" run --rm --no-deps ollama-init
    - docker compose --env-file "$DEPLOY_DEPENDENCIES_COMPOSE_ENV" --file "$DEPLOY_DEPENDENCIES_COMPOSE_FILE" run --rm --no-deps nacos-init
    - |
      for SVC in api-gateway core-service ai-service community-service middleware-service database-service host-service network-service security-service; do
        docker build --build-arg SERVICE="$SVC" --build-arg IMAGE_REVISION="$CI_COMMIT_SHA" --build-arg IMAGE_VERSION="$IMAGE_TAG" --tag "$IMAGE_NAMESPACE/$SVC:$IMAGE_TAG" --file deploy/Dockerfile .
      done
    - docker build --build-arg IMAGE_REVISION="$CI_COMMIT_SHA" --build-arg IMAGE_VERSION="$IMAGE_TAG" --tag "$IMAGE_NAMESPACE/frontend:$IMAGE_TAG" --file deploy/Dockerfile.frontend .
    - sh deploy/validate-ai-auth.sh "$DEPLOY_SERVICES_ENV" "$IMAGE_NAMESPACE/ai-service:$IMAGE_TAG" "$DEPLOY_COMPOSE_ENV"
    - DEPLOY_VERIFY_MODE=full sh deploy/rollback.sh deploy api-gateway core-service ai-service community-service middleware-service database-service host-service network-service security-service frontend
    - docker compose --env-file "$DEPLOY_DEPENDENCIES_COMPOSE_ENV" --file "$DEPLOY_DEPENDENCIES_COMPOSE_FILE" ps --all mysql nacos nacos-init ollama ollama-init etcd minio milvus

# ----------------------------------------------------------------------------
# 单服务自动部署（增量 CD）：master 上仅当该服务自身/能力模块/共享库变更时，
# 所有 validate/build 作业通过后自动部署该服务；未变服务不进流水线，不部署也不阻断。
# 每个 changes 与对应 verify:<svc> 保持一致，但去掉 .gitlab-ci.yml——
# 改 CI 文件本身不应触发未变服务的重部署。改共享库仍扇出到全部服务。
# Web 手动流水线里可逐个手动部署（非阻断）。
# ----------------------------------------------------------------------------
deploy:api-gateway:
  extends: .deploy-tpl
  variables: { SVC: api-gateway }
  rules:
    - *skip-schedule
    - *web-manual
    - if: '$CI_COMMIT_REF_NAME == "master"'
      changes:
        - backend/api-gateway/**/*
        - backend/{pom.xml,modular-monolith-parent/pom.xml,common-core/**/*,common-security/**/*,common-web/**/*}

deploy:core-service:
  extends: .deploy-tpl
  variables: { SVC: core-service }
  rules:
    - *skip-schedule
    - *web-manual
    - if: '$CI_COMMIT_REF_NAME == "master"'
      changes:
        - backend/{core-service,identity,catalog,standards}/**/*
        - backend/{pom.xml,modular-monolith-parent/pom.xml,common-core/**/*,common-security/**/*,common-web/**/*}

deploy:ai-service:
  extends: .deploy-tpl
  variables: { SVC: ai-service }
  rules:
    - *skip-schedule
    - *web-manual
    - if: '$CI_COMMIT_REF_NAME == "master"'
      changes:
        - backend/{ai-service,knowledge,wiki,ops-agent}/**/*
        - backend/{pom.xml,modular-monolith-parent/pom.xml,common-core/**/*,common-security/**/*,common-web/**/*}

