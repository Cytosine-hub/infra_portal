# ----------------------------------------------------------------------------
# 集成流水线（骨架）：起 Nacos + 各服务，跑认证越权与联通验证。
# 需要 docker-in-docker 或预发环境；这里给出结构与验证清单，按你们环境补全。
# 手动触发，避免每次 push 都跑重活。
# ----------------------------------------------------------------------------
integration:e2e:
  stage: integration
  allow_failure: true          # 骨架阶段先不阻断；补全后改 false
  # services:                  # ← 取消注释并配好后启用
  #   - name: nacos/nacos-server:v2.3.2
  #     alias: nacos
  #   - name: mysql:8
  #     alias: mysql
  script:
    - echo "== 集成验证骨架（按 docs 阶段5 安全清单补全）=="
    - echo "1) 起 Nacos + MySQL + 各服务 fat jar（cloud profile，注入 GATEWAY_SIGNING_SECRET）"
    - echo "2) 经网关带有效 token 访问受保护端点 -> 期望 200"
    - echo "3) 越权A：直连下游带伪造 X-Roles 但无签名 -> 期望 401/403"
    - echo "4) 越权B：客户端经网关塞伪造 X-User -> 网关剥除后按 token 重注入"
    - echo "5) 越权C：直连 introspect 不带 X-Gateway-Sign -> 期望 403"
    - echo "6) 过期 token / 退出后同 token -> 期望 401"
    - echo "TODO 用 docker compose 起服务并用 curl 断言以上各条"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_REF_NAME == "master"'
      when: manual
      allow_failure: true

# ----------------------------------------------------------------------------
# 部署：使用 Runner 主机 Docker Compose 启动对应服务，镜像只读取 Runner 主机已构建版本。
# DEPLOY_COMPOSE_ENV_FILE 和 DEPLOY_SERVICES_ENV_FILE 必须在 GitLab CI/CD Variables
# 中配置为受保护的“文件”变量，分别基于两个 example 文件，禁止提交真实密钥。
# ----------------------------------------------------------------------------
.deploy-common:
  stage: deploy
  resource_group: staging-infra-portal
  interruptible: false
  before_script:
    - ': "${DEPLOY_COMPOSE_ENV_FILE:?缺少 DEPLOY_COMPOSE_ENV_FILE（GitLab File 类型变量）}"'
    - ': "${DEPLOY_SERVICES_ENV_FILE:?缺少 DEPLOY_SERVICES_ENV_FILE（GitLab File 类型变量）}"'
    - test -f "$DEPLOY_COMPOSE_ENV_FILE"
    - test -f "$DEPLOY_SERVICES_ENV_FILE"
    - export BUSINESS_ENV_FILE="$DEPLOY_SERVICES_ENV_FILE"
    - docker compose --env-file "$DEPLOY_COMPOSE_ENV_FILE" --file deploy/docker-compose.yml config --quiet
    - export DEPLOY_COMPOSE_FILE="$DEPLOY_STATE_DIR/docker-compose.yml"
    - export DEPLOY_COMPOSE_ENV="$DEPLOY_STATE_DIR/compose.env"
    - export DEPLOY_SERVICES_ENV="$DEPLOY_STATE_DIR/services.env"
    - mkdir -p "$DEPLOY_STATE_DIR" "$DEPLOY_STATE_DIR/../db"
    - chmod 700 "$DEPLOY_STATE_DIR"
    - cp deploy/docker-compose.yml "$DEPLOY_COMPOSE_FILE"
    - cp "$DEPLOY_COMPOSE_ENV_FILE" "$DEPLOY_COMPOSE_ENV"
    - cp "$DEPLOY_SERVICES_ENV_FILE" "$DEPLOY_SERVICES_ENV"
    - cp db/init.sql "$DEPLOY_STATE_DIR/../db/init.sql"
    - cp db/seed.sql "$DEPLOY_STATE_DIR/../db/seed.sql"
    - |
      if grep -q '^IMAGE_TAG=' "$DEPLOY_COMPOSE_ENV"; then
        sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$CI_COMMIT_SHA/" "$DEPLOY_COMPOSE_ENV"
      else
        printf '\nIMAGE_TAG=%s\n' "$CI_COMMIT_SHA" >> "$DEPLOY_COMPOSE_ENV"
      fi
      if grep -q '^BUSINESS_ENV_FILE=' "$DEPLOY_COMPOSE_ENV"; then
        sed -i 's|^BUSINESS_ENV_FILE=.*|BUSINESS_ENV_FILE=./services.env|' "$DEPLOY_COMPOSE_ENV"
      else
        printf '\nBUSINESS_ENV_FILE=./services.env\n' >> "$DEPLOY_COMPOSE_ENV"
      fi
    - chmod 600 "$DEPLOY_COMPOSE_ENV" "$DEPLOY_SERVICES_ENV"
    - chmod 644 "$DEPLOY_COMPOSE_FILE" "$DEPLOY_STATE_DIR/../db/init.sql" "$DEPLOY_STATE_DIR/../db/seed.sql"
    - export BUSINESS_ENV_FILE=./services.env
    - docker compose --env-file "$DEPLOY_COMPOSE_ENV" --file "$DEPLOY_COMPOSE_FILE" config --quiet
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: false
    - if: '$CI_COMMIT_REF_NAME == "master"'
      when: manual
      allow_failure: false

.deploy-tpl:
  extends: .deploy-common
  environment:
    name: "staging/$SVC"
  script:
    - export IMAGE_TAG="$CI_COMMIT_SHA"
    - docker build --tag "$IMAGE_NAMESPACE/nacos-init:$IMAGE_TAG" --file deploy/Dockerfile.nacos-init .
    - |
      if ! docker image inspect "$IMAGE_NAMESPACE/$SVC:$IMAGE_TAG" >/dev/null 2>&1; then
        echo "Runner 缺少服务镜像，开始构建：$IMAGE_NAMESPACE/$SVC:$IMAGE_TAG"
        docker build --build-arg SERVICE="$SVC" \
          --tag "$IMAGE_NAMESPACE/$SVC:$IMAGE_TAG" \
          --tag "$IMAGE_NAMESPACE/$SVC:latest" \
          --file deploy/Dockerfile .
      fi
    - docker compose --env-file "$DEPLOY_COMPOSE_ENV" --file "$DEPLOY_COMPOSE_FILE" up --detach --wait --no-build --pull never "$SVC"
    - docker compose --env-file "$DEPLOY_COMPOSE_ENV" --file "$DEPLOY_COMPOSE_FILE" ps "$SVC"

# 单独部署依赖组件。MySQL 首次创建数据卷时会执行 db/init.sql 和 db/seed.sql；
# 后续部署不会重放初始化脚本。
deploy:dependencies:
  extends: .deploy-common
  environment:
    name: staging/dependencies
  script:
    - export IMAGE_TAG="$CI_COMMIT_SHA"
    - docker build --tag "$IMAGE_NAMESPACE/nacos-init:$IMAGE_TAG" --file deploy/Dockerfile.nacos-init .
    - docker compose --env-file "$DEPLOY_COMPOSE_ENV" --file "$DEPLOY_COMPOSE_FILE" up --detach --wait --no-build mysql nacos etcd minio milvus
    - docker compose --env-file "$DEPLOY_COMPOSE_ENV" --file "$DEPLOY_COMPOSE_FILE" run --rm --no-deps nacos-init
    - docker compose --env-file "$DEPLOY_COMPOSE_ENV" --file "$DEPLOY_COMPOSE_FILE" ps --all mysql nacos nacos-init etcd minio milvus

# 一键构建并部署完整运行栈。该 job 独立完成构建和依赖镜像预拉取，
# 不依赖未选择的手动作业，从而可直接在 GitLab Web 流水线中执行。
deploy:full-stack:
  extends: .deploy-common
  environment:
    name: staging/full-stack
  script:
    - export IMAGE_TAG="$CI_COMMIT_SHA"
    - |
      for SVC in api-gateway core-service ai-service community-service middleware-service database-service host-service network-service security-service; do
        docker build --build-arg SERVICE="$SVC" --tag "$IMAGE_NAMESPACE/$SVC:$IMAGE_TAG" --tag "$IMAGE_NAMESPACE/$SVC:latest" --file deploy/Dockerfile .
      done
    - docker build --tag "$IMAGE_NAMESPACE/frontend:$IMAGE_TAG" --tag "$IMAGE_NAMESPACE/frontend:latest" --file deploy/Dockerfile.frontend .
    - docker build --tag "$IMAGE_NAMESPACE/nacos-init:$IMAGE_TAG" --file deploy/Dockerfile.nacos-init .
    - docker compose --env-file "$DEPLOY_COMPOSE_ENV" --file "$DEPLOY_COMPOSE_FILE" pull mysql nacos etcd minio milvus
    - docker compose --env-file "$DEPLOY_COMPOSE_ENV" --file "$DEPLOY_COMPOSE_FILE" up --detach --wait --no-build --pull never
    - docker compose --env-file "$DEPLOY_COMPOSE_ENV" --file "$DEPLOY_COMPOSE_FILE" exec -T frontend wget --quiet --output-document=/dev/null http://127.0.0.1/
    - docker compose --env-file "$DEPLOY_COMPOSE_ENV" --file "$DEPLOY_COMPOSE_FILE" exec -T frontend wget --quiet --output-document=/dev/null http://127.0.0.1/api/public/releases
    - docker compose --env-file "$DEPLOY_COMPOSE_ENV" --file "$DEPLOY_COMPOSE_FILE" ps --all

deploy:api-gateway:
  extends: .deploy-tpl
  variables: { SVC: api-gateway }
  needs: [{ job: "verify:api-gateway", optional: true }]

deploy:core-service:
  extends: .deploy-tpl
  variables: { SVC: core-service }
  needs: [{ job: "verify:core-service", optional: true }]

deploy:ai-service:
  extends: .deploy-tpl
  variables: { SVC: ai-service }
  needs: [{ job: "verify:ai-service", optional: true }]

deploy:community-service:
  extends: .deploy-tpl
  variables: { SVC: community-service }
  needs: [{ job: "verify:community-service", optional: true }]

deploy:middleware-service:
  extends: .deploy-tpl
  variables: { SVC: middleware-service }
  needs: [{ job: "verify:middleware-service", optional: true }]

deploy:database-service:
  extends: .deploy-tpl
  variables: { SVC: database-service }
  needs: [{ job: "verify:database-service", optional: true }]

deploy:host-service:
  extends: .deploy-tpl
  variables: { SVC: host-service }
  needs: [{ job: "verify:host-service", optional: true }]

deploy:network-service:
  extends: .deploy-tpl
  variables: { SVC: network-service }
  needs: [{ job: "verify:network-service", optional: true }]

deploy:security-service:
  extends: .deploy-tpl
  variables: { SVC: security-service }
  needs: [{ job: "verify:security-service", optional: true }]

# 前端独立更新不拉起依赖，避免要求同一提交同时存在 Gateway 镜像。
deploy:frontend:
  extends: .deploy-common
  environment:
    name: staging/frontend
  needs: [{ job: "verify:frontend", optional: true }]
  script:
    - export IMAGE_TAG="$CI_COMMIT_SHA"
    - |
      if ! docker image inspect "$IMAGE_NAMESPACE/frontend:$IMAGE_TAG" >/dev/null 2>&1; then
        echo "Runner 缺少前端镜像，开始构建：$IMAGE_NAMESPACE/frontend:$IMAGE_TAG"
        docker build \
          --tag "$IMAGE_NAMESPACE/frontend:$IMAGE_TAG" \
          --tag "$IMAGE_NAMESPACE/frontend:latest" \
          --file deploy/Dockerfile.frontend .
      fi
    - docker compose --env-file "$DEPLOY_COMPOSE_ENV" --file "$DEPLOY_COMPOSE_FILE" up --detach --wait --no-deps --no-build --pull never frontend
    - docker compose --env-file "$DEPLOY_COMPOSE_ENV" --file "$DEPLOY_COMPOSE_FILE" exec -T frontend wget --quiet --output-document=/dev/null http://127.0.0.1/
    - docker compose --env-file "$DEPLOY_COMPOSE_ENV" --file "$DEPLOY_COMPOSE_FILE" ps frontend
