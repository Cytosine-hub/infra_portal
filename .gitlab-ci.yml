# 前端独立更新不拉起依赖，避免要求同一提交同时存在 Gateway 镜像。
deploy:frontend:
  extends: .deploy-common
  environment:
    name: staging/frontend
  # 前端有变更时（master）自动部署；与 verify:frontend 触发路径一致（去掉 .gitlab-ci.yml）。
  rules:
    - *skip-schedule
    - *web-manual
    - if: '$CI_COMMIT_REF_NAME == "master"'
      changes:
        - frontend/**/*
        - deploy/{Dockerfile.frontend,nginx.conf}
  script:
    - |
      if ! docker image inspect "$IMAGE_NAMESPACE/frontend:$IMAGE_TAG" >/dev/null 2>&1; then
        echo "Runner 缺少前端镜像，开始构建：$IMAGE_NAMESPACE/frontend:$IMAGE_TAG"
        docker build \
          --build-arg IMAGE_REVISION="$CI_COMMIT_SHA" \
          --build-arg IMAGE_VERSION="$IMAGE_TAG" \
          --tag "$IMAGE_NAMESPACE/frontend:$IMAGE_TAG" \
          --file deploy/Dockerfile.frontend .
      fi
    - DEPLOY_NO_DEPS=true DEPLOY_VERIFY_MODE=frontend sh deploy/rollback.sh deploy frontend

# 手动回滚只读取 Runner 上持久化的运行清单和成功部署历史，不覆盖业务密钥，
# 也不依赖 AUTO_ROLLBACK_ENABLED。每个服务作为独立手动作业展示。
.rollback-common:
  stage: rollback
  resource_group: staging-infra-portal
  interruptible: false
  before_script:
    - export DEPLOY_BUSINESS_DIR="$DEPLOY_COMPOSE_ROOT/business"
    - export COMPOSE_FILE="$DEPLOY_BUSINESS_DIR/compose.yml"
    - export COMPOSE_ENV_FILE="$DEPLOY_BUSINESS_DIR/compose.env"
    - export ROLLBACK_STATE_ROOT="$DEPLOY_ROLLBACK_STATE_ROOT"
    - test -f "$COMPOSE_FILE"
    - test -f "$COMPOSE_ENV_FILE"
    - test -f "$DEPLOY_BUSINESS_DIR/services.env"
    - export BUSINESS_ENV_FILE=./services.env
    - docker compose --env-file "$COMPOSE_ENV_FILE" --file "$COMPOSE_FILE" config --quiet
  rules:
    - *skip-schedule
    - *web-manual
    - if: '$CI_COMMIT_REF_NAME == "master"'
      when: manual
      allow_failure: true

.rollback-tpl:
  extends: .rollback-common
  environment:
    name: "staging/rollback/$SVC"
  script:
    - sh deploy/rollback.sh manual "$SVC"

rollback:api-gateway:
  extends: .rollback-tpl
  variables: { SVC: api-gateway }

rollback:core-service:
  extends: .rollback-tpl
  variables: { SVC: core-service }

rollback:ai-service:
  extends: .rollback-tpl
  variables: { SVC: ai-service }

rollback:community-service:
  extends: .rollback-tpl
  variables: { SVC: community-service }

rollback:middleware-service:
  extends: .rollback-tpl
  variables: { SVC: middleware-service }

rollback:database-service:
  extends: .rollback-tpl
  variables: { SVC: database-service }

rollback:host-service:
  extends: .rollback-tpl
  variables: { SVC: host-service }

rollback:network-service:
  extends: .rollback-tpl
  variables: { SVC: network-service }

rollback:security-service:
  extends: .rollback-tpl
  variables: { SVC: security-service }

rollback:frontend:
  extends: .rollback-tpl
  variables: { SVC: frontend }

rollback:all-backend-services:
  extends: .rollback-common
  environment:
    name: staging/rollback/all-backend-services
  script:
    - sh deploy/rollback.sh manual api-gateway core-service ai-service community-service middleware-service database-service host-service network-service security-service

rollback:all-services:
  extends: .rollback-common
  environment:
    name: staging/rollback/all-services
  script:
    - sh deploy/rollback.sh manual api-gateway core-service ai-service community-service middleware-service database-service host-service network-service security-service frontend

# GitLab Pipeline Schedule 每日触发；只清理 10 个业务服务的新格式标签。
# 每个服务按镜像创建时间保留最近 3 个，旧 SHA 标签和依赖镜像不在清理范围内。
cleanup:business-images:
  stage: cleanup
  resource_group: staging-infra-portal
  interruptible: false
  variables:
    BUSINESS_IMAGE_KEEP_COUNT: "3"
  script:
    - sh deploy/cleanup-business-images.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
