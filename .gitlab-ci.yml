# ============================================================================
# 集成中心门户 · monorepo 微服务 CI/CD
#
# 设计：每个服务一条独立流水线，按【路径触发】——只有相关目录变更才构建对应服务；
#       改动共享库 common-* 或父 POM 则【扇出】重建所有服务（每个服务的 changes 里都含这几条）。
# 构建期服务之间零依赖：只用 `mvn -pl <服务> -am`（also-make，连带构建 common-* 与其能力模块）。
# 服务间真实联通（网关↔Nacos↔服务、认证越权）属【集成】层，单独一条流水线在预发环境跑。
#
# 需要：Runner Job 可访问 Runner 主机的 Docker Socket（见 runner/config.md）。
#       编译、镜像构建和 Docker Compose 部署均在同一台 Runner 主机完成，不推送 JAR 或镜像制品。
# ============================================================================

# 只在【前后端、部署配置或 CI 文件】改动时创建流水线（MR / push / tag），
# 或由 GitLab Web 页面手动创建完整流水线。
# 纯文档改动（agent.md、docs、README 等）没有可跑的 job → 不创建流水线，
# 避免 GitLab 把"空流水线"判为 failed（doc-only 合并不再爆红叉）。
workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: ["backend/**/*", "frontend/**/*", "deploy/**/*", "db/**/*", ".gitlab-ci.yml"]
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes: ["backend/**/*", "frontend/**/*", "deploy/**/*", "db/**/*", ".gitlab-ci.yml"]

default:
  image:
    name: docker:27-cli
    pull_policy: if-not-present       # 仅本地不存在时拉取镜像
  tags: [TLZJJ]                          # 项目 Runner 标签

variables:
  DOCKER_BUILDKIT: "1"
  IMAGE_NAMESPACE: "infra-portal"
  # 部署清单持久化到 Runner 宿主机挂载目录，避免 Job 清理 /builds 后无法手动管理。
  DEPLOY_STATE_DIR: "/app/infra-portal/deploy"

stages:
  - verify        # 编译 + 单元测试 + 打包（每服务独立）
  - integration   # 端到端 / 认证越权（需 Nacos + 多服务，手动）
  - deploy        # 部署业务服务、依赖组件或完整运行栈（手动）

# 部署配置静态验证使用临时随机测试密钥，不读取受保护的部署变量，也不启动或更新服务。
verify:deployment:
  stage: verify
  script:
    - trap 'rm -f deploy/compose.test.env deploy/services.test.env' EXIT
    - sh deploy/generate-test-env.sh
    - docker compose --env-file deploy/compose.test.env --file deploy/docker-compose.yml config --quiet
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - changes:
        - deploy/**/*
        - db/**/*
        - .gitignore
        - .gitlab-ci.yml

# 服务构建模板：Docker 多阶段构建中执行 mvn -pl <SVC> -am clean verify，
# 然后将可执行 JAR 封装为 Runner 主机镜像。镜像只保留在 Runner 主机的 Docker 守护进程中。
.svc-verify:
  stage: verify
  script:
    - export IMAGE_NAME="$IMAGE_NAMESPACE/$SVC"
    - docker build --build-arg SERVICE="$SVC" --tag "$IMAGE_NAME:$CI_COMMIT_SHA" --tag "$IMAGE_NAME:latest" --file deploy/Dockerfile .
    - echo "== Runner 主机构建镜像：$IMAGE_NAME:$CI_COMMIT_SHA =="
    - docker image inspect "$IMAGE_NAME:$CI_COMMIT_SHA" --format 'ID={{.Id}}\n创建时间={{.Created}}\n大小={{.Size}} bytes'

# 完整业务服务构建入口。单服务构建仍复用下方 verify:<service> job，
# 可按路径自动触发，也可在 Web 流水线中逐项手动运行。
verify:all-services:
  stage: verify
  script:
    - |
      for SVC in api-gateway core-service ai-service community-service middleware-service database-service host-service network-service security-service; do
        export IMAGE_NAME="$IMAGE_NAMESPACE/$SVC"
        docker build --build-arg SERVICE="$SVC" --tag "$IMAGE_NAME:$CI_COMMIT_SHA" --tag "$IMAGE_NAME:latest" --file deploy/Dockerfile .
        docker image inspect "$IMAGE_NAME:$CI_COMMIT_SHA" --format 'ID={{.Id}}\n创建时间={{.Created}}\n大小={{.Size}} bytes'
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_REF_NAME == "master"'
      when: manual
      allow_failure: true
    - changes:
        - deploy/**/*
        - db/**/*
      when: manual
      allow_failure: true

# Compose 中的前端生产镜像，使用与本地完整栈相同的多阶段构建定义。
verify:frontend:
  stage: verify
  script:
    - export IMAGE_NAME="$IMAGE_NAMESPACE/frontend"
    - docker build --tag "$IMAGE_NAME:$CI_COMMIT_SHA" --tag "$IMAGE_NAME:latest" --file deploy/Dockerfile.frontend .
    - docker image inspect "$IMAGE_NAME:$CI_COMMIT_SHA" --format 'ID={{.Id}}\n创建时间={{.Created}}\n大小={{.Size}} bytes'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - changes:
        - frontend/**/*
        - deploy/Dockerfile.frontend
        - deploy/nginx.conf
        - .gitlab-ci.yml

# 第三方依赖不在仓库内编译；直接拉取镜像，避免 Compose 解析业务服务密钥。
prepare:dependencies:
  stage: verify
  script:
    - docker pull "mysql:${MYSQL_VERSION:-8.0}"
    - docker pull "nacos/nacos-server:${NACOS_VERSION:-v2.3.2}"
    - docker pull "quay.io/coreos/etcd:${ETCD_VERSION:-v3.5.5}"
    - docker pull "minio/minio:${MINIO_VERSION:-RELEASE.2023-03-20T20-16-18Z}"
    - docker pull "milvusdb/milvus:${MILVUS_VERSION:-v2.3.4}"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_REF_NAME == "master"'
      when: manual
      allow_failure: true

# ----------------------------------------------------------------------------
# 每服务流水线（路径触发）。
# 每个 changes 列表 = 该服务自身 + 其能力模块 + 【扇出段】(共享库/父POM/本文件)。
# 改共享库 → 所有服务的扇出段命中 → 全部重建。
# ----------------------------------------------------------------------------
verify:api-gateway:
  extends: .svc-verify
  variables: { SVC: api-gateway }
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
